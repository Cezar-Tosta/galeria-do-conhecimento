<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Galeria do Conhecimento — Uma coleção de saberes ilustrados sobre Psicologia Analítica de Carl Gustav Jung."/>
<meta name="theme-color" content="#0d1a2b"/>

<!-- Open Graph / GitHub Pages -->
<meta property="og:type"        content="website"/>
<meta property="og:title"       content="Galeria do Conhecimento"/>
<meta property="og:description" content="Uma coleção de saberes ilustrados sobre a Psicologia Analítica de Jung."/>
<meta property="og:image"       content="imagens/jung-principais-ideias.png"/>

<title>Galeria do Conhecimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;1,400&display=swap" rel="stylesheet"/>

<style>
/* ══════════════════════════════════════════
   RESET & TOKENS
   ══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --navy:#0d1a2b;--navy-mid:#112236;--navy-light:#1a2f47;
  --gold:#c9a84c;--gold-light:#e2c97e;--gold-dim:#7a6030;
  --cream:#f0e6c8;--cream-dim:#b8a880;--text:#d4c89a;

  --fs-xs:   0.95rem;
  --fs-sm:   1.1rem;
  --fs-base: 1.25rem;
  --fs-md:   1.4rem;
  --fs-lg:   1.55rem;
  --fs-xl:   1.85rem;
  --fs-2xl:  2.3rem;

  --nav-h: 64px;
  --radius: 2px;
  --trans-fast: .18s ease;
  --trans-mid:  .3s ease;
}

html{scroll-behavior:smooth;font-size:18px}
body{
  background:var(--navy);color:var(--text);
  font-family:'EB Garamond',Georgia,serif;font-size:var(--fs-base);
  min-height:100vh;overflow-x:hidden;line-height:1.65;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse at 15% 20%,rgba(201,168,76,.05) 0%,transparent 55%),
    radial-gradient(ellipse at 85% 80%,rgba(201,168,76,.05) 0%,transparent 55%);
  pointer-events:none;
}

/* ══════════════════════════════════════════
   NAV
   ══════════════════════════════════════════ */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:linear-gradient(to bottom,rgba(8,16,28,.98),rgba(8,16,28,.92));
  border-bottom:1px solid var(--gold-dim);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2rem;height:var(--nav-h);
}

.nav-brand{
  font-family:'Cinzel',serif;font-size:clamp(0.85rem,2vw,1.1rem);
  font-weight:700;letter-spacing:.12em;color:var(--gold-light);
  text-decoration:none;white-space:nowrap;
}

.nav-links{display:flex;gap:1.8rem;list-style:none}
.nav-links a{
  font-family:'Cinzel',serif;font-size:var(--fs-sm);letter-spacing:.1em;
  color:var(--cream-dim);text-decoration:none;transition:color var(--trans-fast);
  white-space:nowrap;
}
.nav-links a:hover{color:var(--gold-light)}

/* Hamburger */
.nav-hamburger{
  display:none;flex-direction:column;justify-content:center;align-items:center;
  gap:5px;width:42px;height:42px;background:none;border:1px solid var(--gold-dim);
  cursor:pointer;padding:0;transition:border-color var(--trans-fast);
}
.nav-hamburger:hover{border-color:var(--gold)}
.nav-hamburger span{
  display:block;width:20px;height:1.5px;background:var(--gold);
  transition:transform var(--trans-mid),opacity var(--trans-mid);
  transform-origin:center;
}
.nav-hamburger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.nav-hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.nav-hamburger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}

/* Mobile nav drawer */
.nav-drawer{
  position:fixed;top:var(--nav-h);left:0;right:0;z-index:99;
  background:rgba(8,16,28,.98);border-bottom:1px solid var(--gold-dim);
  backdrop-filter:blur(10px);
  display:flex;flex-direction:column;gap:0;
  max-height:0;overflow:hidden;
  transition:max-height var(--trans-mid);
}
.nav-drawer.open{max-height:300px}
.nav-drawer a{
  font-family:'Cinzel',serif;font-size:var(--fs-sm);letter-spacing:.12em;
  color:var(--cream-dim);text-decoration:none;
  padding:1rem 2rem;border-bottom:1px solid rgba(122,96,48,.2);
  transition:color var(--trans-fast),background var(--trans-fast);
}
.nav-drawer a:hover{color:var(--gold-light);background:rgba(201,168,76,.04)}

/* ══════════════════════════════════════════
   HERO
   ══════════════════════════════════════════ */
.hero{
  position:relative;z-index:1;
  padding:calc(var(--nav-h) + 4rem) 1.5rem 3.5rem;text-align:center;
}
.hero-orn{display:flex;align-items:center;justify-content:center;gap:1rem;margin-bottom:1.2rem}
.orn-line{width:80px;height:1px;background:linear-gradient(to right,transparent,var(--gold-dim))}
.orn-line.r{background:linear-gradient(to left,transparent,var(--gold-dim))}
.hero h1{
  font-family:'Cinzel',serif;font-size:clamp(2rem,5vw,3.6rem);
  font-weight:700;color:var(--gold-light);letter-spacing:.07em;
  line-height:1.1;margin-bottom:.6rem;
}
.hero-sub{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(1.2rem,2.5vw,1.6rem);color:var(--cream-dim);letter-spacing:.04em;
}
.hero-div{
  width:200px;height:1px;
  background:linear-gradient(to right,transparent,var(--gold),transparent);
  margin:1.8rem auto;
}

/* ══════════════════════════════════════════
   SEARCH + FILTER BAR
   ══════════════════════════════════════════ */
.controls{
  position:relative;z-index:1;
  max-width:1200px;margin:0 auto;padding:0 1.5rem 2.5rem;
  display:flex;flex-direction:column;gap:1rem;
}

/* Search */
.search-wrap{
  position:relative;display:flex;align-items:center;
  max-width:420px;
}
.search-wrap svg{
  position:absolute;left:.85rem;pointer-events:none;
  color:var(--gold-dim);flex-shrink:0;
}
.search-input{
  width:100%;font-family:'Cinzel',serif;font-size:var(--fs-xs);
  letter-spacing:.1em;background:rgba(17,34,54,.8);
  border:1px solid var(--gold-dim);color:var(--cream);
  padding:.65rem 1rem .65rem 2.6rem;outline:none;
  transition:border-color var(--trans-fast),box-shadow var(--trans-fast);
  min-height:44px;
}
.search-input::placeholder{color:var(--gold-dim);opacity:.8}
.search-input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(201,168,76,.12);
}

.search-clear{
  position:absolute;right:.7rem;background:none;border:none;
  color:var(--gold-dim);cursor:pointer;font-size:1rem;padding:.25rem;
  opacity:0;pointer-events:none;transition:opacity var(--trans-fast);
  line-height:1;
}
.search-clear.visible{opacity:1;pointer-events:all}

/* Filter */
.filter-bar{display:flex;gap:.7rem;flex-wrap:wrap}
.filter-btn{
  font-family:'Cinzel',serif;font-size:var(--fs-xs);letter-spacing:.14em;
  text-transform:uppercase;background:none;border:1px solid var(--gold-dim);
  color:var(--cream-dim);padding:.55rem 1.2rem;cursor:pointer;
  transition:background var(--trans-fast),color var(--trans-fast),border-color var(--trans-fast);
  min-height:44px;
}
.filter-btn:hover,.filter-btn.active{
  background:var(--gold);color:var(--navy);border-color:var(--gold);
}

/* ══════════════════════════════════════════
   SECTION
   ══════════════════════════════════════════ */
.section{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 1.5rem 5rem}
.sec-label{
  font-family:'Cinzel',serif;font-size:var(--fs-xs);letter-spacing:.25em;
  text-transform:uppercase;color:var(--gold-dim);margin-bottom:.5rem;
}
.sec-title{
  font-family:'Cinzel',serif;font-size:clamp(1.3rem,2.5vw,1.9rem);
  color:var(--gold-light);font-weight:600;margin-bottom:2rem;
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
}
.sec-title::after{
  content:'';flex:1;min-width:40px;height:1px;
  background:linear-gradient(to right,var(--gold-dim),transparent);
}
.count-badge{
  font-size:var(--fs-xs);color:var(--gold-dim);letter-spacing:.1em;
  border:1px solid var(--gold-dim);padding:.2rem .7rem;
  font-weight:400;white-space:nowrap;
}

/* ══════════════════════════════════════════
   GRID
   ══════════════════════════════════════════ */
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));
  gap:1.5rem;
}

/* ══════════════════════════════════════════
   CARD
   ══════════════════════════════════════════ */
.card{
  position:relative;
  background:linear-gradient(145deg,var(--navy-mid),var(--navy-light));
  border:1px solid var(--gold-dim);cursor:pointer;overflow:hidden;
  transition:transform var(--trans-mid),box-shadow var(--trans-mid),border-color var(--trans-mid);
  /* Entrada animada via Intersection Observer */
  opacity:0;transform:translateY(24px);
}
.card.visible{
  animation:cardIn .5s ease forwards;
}
@keyframes cardIn{
  to{opacity:1;transform:translateY(0)}
}
.card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(201,168,76,.07) 0%,transparent 60%);
  opacity:0;transition:opacity var(--trans-mid);
}
.card:hover,.card:focus-visible{
  transform:translateY(-5px);border-color:var(--gold);
  box-shadow:0 10px 40px rgba(201,168,76,.16),0 0 0 1px rgba(201,168,76,.1);
  outline:none;
}
.card:hover::before,.card:focus-visible::before{opacity:1}

.card-thumb-wrap{
  aspect-ratio:4/5;overflow:hidden;
  background:linear-gradient(135deg,#112236,#1a2f47);
  display:flex;align-items:center;justify-content:center;
}
.card-thumb{
  width:100%;height:100%;object-fit:cover;display:block;
  filter:sepia(.25) brightness(.88);
  transition:filter var(--trans-mid),transform var(--trans-mid);
}
.card:hover .card-thumb,.card:focus-visible .card-thumb{
  filter:sepia(.1) brightness(.97);transform:scale(1.03);
}

.card-body{padding:1.2rem 1.4rem 1.5rem;border-top:1px solid var(--gold-dim)}
.card-tag{
  display:inline-block;font-family:'Cinzel',serif;font-size:var(--fs-xs);
  letter-spacing:.14em;color:var(--navy);background:var(--gold-dim);
  padding:.2rem .65rem;margin-bottom:.6rem;text-transform:uppercase;
}
.card-num{
  font-family:'Cinzel',serif;font-size:var(--fs-xs);letter-spacing:.2em;
  color:var(--gold-dim);margin-bottom:.35rem;
}
.card-title{
  font-family:'Cinzel',serif;font-size:var(--fs-md);font-weight:600;
  color:var(--gold-light);line-height:1.3;margin-bottom:.5rem;
}
.card-desc{
  font-size:var(--fs-base);color:var(--cream-dim);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card-cta{
  display:inline-flex;align-items:center;gap:.4rem;margin-top:.85rem;
  font-family:'Cinzel',serif;font-size:var(--fs-sm);letter-spacing:.12em;color:var(--gold);
}

/* ══════════════════════════════════════════
   EMPTY / NO RESULTS
   ══════════════════════════════════════════ */
.empty-state{
  grid-column:1/-1;text-align:center;padding:4rem 2rem;
  display:flex;flex-direction:column;align-items:center;gap:1rem;
}
.empty-state svg{opacity:.3}
.empty-state p{
  font-family:'Cinzel',serif;font-size:var(--fs-md);
  letter-spacing:.12em;color:var(--gold-dim);
}
.empty-state small{
  font-family:'EB Garamond',serif;font-size:var(--fs-base);
  color:var(--cream-dim);letter-spacing:.04em;
}

/* ══════════════════════════════════════════
   MODAL
   ══════════════════════════════════════════ */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(4,10,20,.93);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity var(--trans-mid);
}
.modal-overlay.active{opacity:1;pointer-events:all}

.modal{
  position:relative;
  background:linear-gradient(145deg,#0f1e30,#162840);
  border:1px solid var(--gold-dim);max-width:960px;width:100%;max-height:92vh;
  overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
  transform:translateY(20px) scale(.98);
  transition:transform var(--trans-mid);
}
.modal-overlay.active .modal{transform:translateY(0) scale(1)}

.modal-img-wrap{position:relative;overflow:hidden;min-height:320px}
.modal-img{width:100%;height:100%;object-fit:cover;filter:sepia(.2) brightness(.88);display:block}
.modal-img-fade{position:absolute;inset:0;background:linear-gradient(to right,transparent 50%,#0f1e30)}

.modal-content{
  padding:2.5rem 2.2rem 2.2rem;
  display:flex;flex-direction:column;justify-content:flex-start;overflow-y:auto;
}
.modal-eyebrow{
  font-family:'Cinzel',serif;font-size:var(--fs-xs);letter-spacing:.22em;
  color:var(--gold-dim);text-transform:uppercase;margin-bottom:.7rem;
}
.modal-title{
  font-family:'Cinzel',serif;font-size:clamp(1.4rem,2.8vw,2.1rem);
  color:var(--gold-light);font-weight:700;line-height:1.2;margin-bottom:1rem;
}
.modal-div{width:60px;height:1px;background:var(--gold-dim);margin-bottom:1.3rem}
.modal-body{font-size:clamp(1rem,1.6vw,1.15rem);line-height:1.85;color:var(--cream-dim)}
.modal-body p{margin-bottom:.9rem}
.modal-body em{color:var(--cream);font-style:italic}

.modal-concepts{
  margin-top:1.4rem;border-top:1px solid rgba(201,168,76,.15);
  padding-top:1.4rem;display:none;
}
.mc-title{
  font-family:'Cinzel',serif;font-size:var(--fs-sm);letter-spacing:.18em;
  color:var(--gold);text-transform:uppercase;margin-bottom:.9rem;
}
.clist{list-style:none;display:flex;flex-direction:column;gap:.65rem}
.clist li{
  display:flex;gap:.65rem;font-size:clamp(0.95rem,1.5vw,1.05rem);
  color:var(--cream-dim);line-height:1.5;
}
.clist li::before{
  content:'◆';color:var(--gold-dim);font-size:.55rem;
  margin-top:.45rem;flex-shrink:0;
}

.modal-examples{
  margin-top:1.4rem;border-top:1px solid rgba(201,168,76,.15);
  padding-top:1.4rem;display:none;
}
.me-title{
  font-family:'Cinzel',serif;font-size:var(--fs-sm);letter-spacing:.18em;
  color:var(--gold-light);text-transform:uppercase;margin-bottom:.9rem;
}
.elist{list-style:none;display:flex;flex-direction:column;gap:.65rem}
.elist li{
  display:flex;gap:.65rem;font-size:clamp(0.95rem,1.5vw,1.05rem);
  color:var(--cream-dim);line-height:1.5;
}
.elist li::before{
  content:'▸';color:var(--gold);font-size:.75rem;
  margin-top:.25rem;flex-shrink:0;
}

/* Modal scroll indicator (mobile) */
.modal-scroll-hint{
  display:none;font-family:'Cinzel',serif;font-size:.75rem;
  letter-spacing:.14em;color:var(--gold-dim);text-align:center;
  padding:.5rem;animation:bounceY 1.6s ease-in-out infinite;
}
@keyframes bounceY{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(4px)}
}

.modal-close{
  position:absolute;top:1rem;right:1rem;
  background:rgba(13,26,43,.85);
  border:1px solid var(--gold-dim);color:var(--gold);
  width:42px;height:42px;cursor:pointer;font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--trans-fast),color var(--trans-fast);
  z-index:10;border-radius:0;
}
.modal-close:hover,.modal-close:focus-visible{
  background:var(--gold);color:var(--navy);outline:none;
}

/* Navegação modal (prev/next) */
.modal-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  display:flex;gap:0;z-index:10;pointer-events:none;
  width:100%;justify-content:space-between;padding:0 .5rem;
}
.modal-prev,.modal-next{
  background:rgba(13,26,43,.8);border:1px solid var(--gold-dim);
  color:var(--gold);width:36px;height:36px;
  cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--trans-fast),color var(--trans-fast),opacity var(--trans-fast);
  pointer-events:all;
}
.modal-prev:hover,.modal-next:hover{background:var(--gold);color:var(--navy)}
.modal-prev:disabled,.modal-next:disabled{opacity:.25;cursor:default;pointer-events:none}

/* ══════════════════════════════════════════
   BACK TO TOP
   ══════════════════════════════════════════ */
.back-to-top{
  position:fixed;bottom:2rem;right:1.5rem;z-index:90;
  width:44px;height:44px;
  background:rgba(13,26,43,.9);border:1px solid var(--gold-dim);
  color:var(--gold);cursor:pointer;font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--trans-fast),border-color var(--trans-fast),
              opacity var(--trans-mid),transform var(--trans-mid);
  opacity:0;transform:translateY(10px);pointer-events:none;
  backdrop-filter:blur(6px);
}
.back-to-top.visible{opacity:1;transform:translateY(0);pointer-events:all}
.back-to-top:hover{background:var(--gold);color:var(--navy);border-color:var(--gold)}

/* ══════════════════════════════════════════
   FOOTER
   ══════════════════════════════════════════ */
footer{
  position:relative;z-index:1;border-top:1px solid var(--gold-dim);
  text-align:center;padding:2.5rem;font-family:'Cinzel',serif;
  font-size:var(--fs-xs);letter-spacing:.18em;color:var(--gold-dim);
}

/* ══════════════════════════════════════════
   RESPONSIVIDADE — TABLET (≤ 900px)
   ══════════════════════════════════════════ */
@media(max-width:900px){
  :root{--nav-h:60px}

  .nav-links{display:none}
  .nav-hamburger{display:flex}
  .nav-brand{font-size:clamp(.8rem,3.5vw,1rem)}

  .hero{padding:calc(var(--nav-h) + 3rem) 1.5rem 3rem}

  .gallery-grid{grid-template-columns:repeat(2,1fr);gap:1.2rem}

  .modal{grid-template-columns:1fr}
  .modal-img-wrap{min-height:260px;max-height:280px}
  .modal-img-fade{background:linear-gradient(to bottom,transparent 50%,#0f1e30)}
  .modal-content{padding:2rem 1.8rem 2rem}
  .modal-scroll-hint{display:block}

  /* Prev/Next no mobile ficam no topo da img */
  .modal-nav{top:auto;bottom:calc(100% - var(--modal-img-h,280px) + .5rem);
    transform:none;padding:0 .5rem}
}

/* ══════════════════════════════════════════
   RESPONSIVIDADE — MOBILE GRANDE (≤ 600px)
   ══════════════════════════════════════════ */
@media(max-width:600px){
  :root{
    --nav-h:56px;
    --fs-xs:   0.82rem;
    --fs-sm:   0.95rem;
    --fs-base: 1.05rem;
    --fs-md:   1.15rem;
  }

  nav{padding:0 1rem}
  .nav-brand{font-size:.82rem;letter-spacing:.08em}

  .hero{padding:calc(var(--nav-h) + 2.5rem) 1rem 2.5rem}
  .hero h1{letter-spacing:.04em}

  .controls{padding:0 1rem 2rem;gap:.8rem}
  .search-wrap{max-width:100%}
  .filter-btn{padding:.5rem .9rem;font-size:.75rem}

  .section{padding:0 1rem 4rem}

  .gallery-grid{grid-template-columns:1fr;gap:1rem}

  .card-thumb-wrap{aspect-ratio:16/9}
  .card-body{padding:1rem 1.1rem 1.2rem}
  .card-title{font-size:1.1rem}
  .card-desc{-webkit-line-clamp:3}

  .modal{max-height:95vh}
  .modal-overlay{padding:.5rem}
  .modal-img-wrap{min-height:200px;max-height:230px}
  .modal-content{padding:1.5rem 1.2rem 1.5rem}
  .modal-title{font-size:1.4rem}
  .modal-body{font-size:1rem}
  .clist li,.elist li{font-size:.95rem}
  .modal-close{width:40px;height:40px;top:.6rem;right:.6rem}

  .back-to-top{bottom:1.2rem;right:1rem}
}

/* ══════════════════════════════════════════
   RESPONSIVIDADE — MOBILE PEQUENO (≤ 380px)
   ══════════════════════════════════════════ */
@media(max-width:380px){
  .nav-brand{font-size:.72rem}
  .hero h1{font-size:1.8rem}
  .hero-sub{font-size:1.1rem}
  .card-title{font-size:1rem}
  .modal-title{font-size:1.25rem}
}

/* ══════════════════════════════════════════
   SCROLLBAR
   ══════════════════════════════════════════ */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--navy)}
::-webkit-scrollbar-thumb{background:var(--gold-dim)}
::-webkit-scrollbar-thumb:hover{background:var(--gold)}

/* ══════════════════════════════════════════
   FOCUS VISIBLE GLOBAL
   ══════════════════════════════════════════ */

    author:'Carl Gustav Jung · Psicologia Analítica',
    short:'A alma em suas formas complementares — o aspecto feminino no homem (Anima) e o masculino na mulher (Animus).',
    full:`A Anima é o aspecto feminino do inconsciente do homem — representa qualidades como sensibilidade, intuição, emocionalidade, relacionamento e profundidade interior. O Animus é o aspecto masculino do inconsciente da mulher — representa razão, lógica, assertividade, clareza e direção.

Essas figuras não são estereótipos de gênero, mas dimensões psíquicas complementares presentes em todo ser humano. Quando não reconhecidos, Anima e Animus atuam inconscientemente e geram projeções, conflitos e perda de si mesmo.

A integração traz harmonia entre razão e sentimento, ação e intuição, interior e exterior — conduzindo à totalidade do Self.

<em>"A integração da anima e do animus é essencial para a totalidade do ser."</em> — C. G. Jung`,
    concepts:[
      'Anima — aspecto feminino do inconsciente do homem: sensibilidade, intuição, emocionalidade e alma',
      'Animus — aspecto masculino do inconsciente da mulher: razão, lógica, assertividade e direção',
      'Função da Anima — conecta o homem ao mundo interior, aos sentimentos e à vida psíquica profunda',
      'Função do Animus — orienta a mulher à objetividade, ao pensamento lógico e à tomada de decisões',
      'Projeção — quando não integrados, são projetados nos parceiros, gerando idealização ou conflito',
      'Desequilíbrio — Anima/Animus não reconhecidos geram explosões, autocrítica e relações difíceis',
      'Integração — reconhecer e integrar essas dimensões conduz à individuação e à totalidade do Self',
    ],
    examples:[
      'Anima — homem muito racional que se apaixona intensamente por mulheres "misteriosas e artísticas" está projetando sua Anima',
      'Função da Anima — o homem que começa a meditar, escrever ou cuidar do jardim acessa dimensões interiores antes ignoradas',
      'Animus — mulher criativa mas insegura que se relaciona com homens dominadores está projetando a força do seu Animus',
      'Função do Animus — a mulher que aprende a dizer não com clareza e a defender suas ideias sem pedir desculpas integra o Animus',
      'Manifestação da Anima — sonhos com figuras femininas encantadoras ou ameaçadoras em homens em transição de vida',
      'Manifestação do Animus — voz interior crítica e implacável numa mulher que se sabota antes de falar em público',
      'Integração — homem que desenvolve empatia sem perder objetividade; mulher que age com assertividade sem suprimir a sensibilidade',
    ],
    imgPath:'imagens/anima-e-animus.png'
  },
];

// ═══════════════════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════════════════
let items      = [...initialItems];
let activeTag  = 'all';
let searchTerm = '';
let currentModalIndex = -1;   // índice no array visível

// ═══════════════════════════════════════════════════════
// NAV HAMBURGER
// ═══════════════════════════════════════════════════════
const hamburger = document.getElementById('navHamburger');
const drawer    = document.getElementById('navDrawer');

hamburger.addEventListener('click', () => {
  const isOpen = drawer.classList.toggle('open');
  hamburger.classList.toggle('open', isOpen);
  hamburger.setAttribute('aria-expanded', String(isOpen));
});

function closeDrawer() {
  drawer.classList.remove('open');
  hamburger.classList.remove('open');
  hamburger.setAttribute('aria-expanded', 'false');
}

// Fecha drawer ao clicar fora
document.addEventListener('click', e => {
  if (!hamburger.contains(e.target) && !drawer.contains(e.target)) closeDrawer();
});

// ═══════════════════════════════════════════════════════
// TAGS
// ═══════════════════════════════════════════════════════
function buildTags() {
  const bar      = document.getElementById('filterBar');
  const existing = [...bar.querySelectorAll('[data-tag]')].map(b => b.dataset.tag);
  [...new Set(items.map(i => i.tag).filter(Boolean))].forEach(t => {
    if (existing.includes(t)) return;
    const btn = document.createElement('button');
    btn.className    = 'filter-btn';
    btn.dataset.tag  = t;
    btn.textContent  = t;
    btn.onclick      = () => filterBy(t, btn);
    bar.appendChild(btn);
  });
}

function filterBy(tag, btn) {
  activeTag = tag;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGallery();
}

// ═══════════════════════════════════════════════════════
// BUSCA (com debounce)
// ═══════════════════════════════════════════════════════
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
let   searchTimer = null;

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchTerm = searchInput.value.trim().toLowerCase();
    searchClear.classList.toggle('visible', searchTerm.length > 0);
    renderGallery();
  }, 200);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchTerm = '';
  searchClear.classList.remove('visible');
  searchInput.focus();
  renderGallery();
});

// ═══════════════════════════════════════════════════════
// VISÍVEL = filtro + busca
// ═══════════════════════════════════════════════════════
function getVisible() {
  return items.filter(item => {
    const tagOk  = activeTag === 'all' || item.tag === activeTag;
    if (!tagOk) return false;
    if (!searchTerm) return true;
    return (
      item.title.toLowerCase().includes(searchTerm)  ||
      item.short.toLowerCase().includes(searchTerm)  ||
      item.tag.toLowerCase().includes(searchTerm)
    );
  });
}

// ═══════════════════════════════════════════════════════
// RENDER GALLERY
// ═══════════════════════════════════════════════════════
// Intersection Observer para animação de entrada
const cardObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      cardObserver.unobserve(e.target);
    }
  });
}, { threshold: 0.08 });

function renderGallery() {
  const grid    = document.getElementById('galleryGrid');
  const visible = getVisible();

  document.getElementById('countBadge').textContent =
    `${visible.length} obra${visible.length !== 1 ? 's' : ''}`;

  grid.innerHTML = '';

  if (!visible.length) {
    grid.innerHTML = `
      <div class="empty-state" role="status">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
             stroke="#7a6030" stroke-width="1.2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
        <p>Nenhuma obra encontrada.</p>
        <small>Tente outro termo ou remova o filtro</small>
      </div>`;
    return;
  }

  visible.forEach((item, idx) => {
    const card = document.createElement('article');
    card.className  = 'card';
    card.tabIndex   = 0;
    card.setAttribute('role', 'listitem');
    card.setAttribute('aria-label', item.title);

    card.onclick   = () => openModal(item, visible, idx);
    card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(item, visible, idx); } };

    const thumbHtml = item.imgPath
      ? `<div class="card-thumb-wrap">
           <img class="card-thumb" src="${item.imgPath}" alt="${item.title}" loading="lazy"
                onerror="this.parentElement.innerHTML='<svg width=44 height=44 viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'#7a6030\\' stroke-width=\\'1\\'><rect x=\\'3\\' y=\\'3\\' width=\\'18\\' height=\\'18\\' rx=\\'1\\'/><circle cx=\\'8.5\\' cy=\\'8.5\\' r=\\'1.5\\'/><path d=\\'M21 15l-5-5L5 21\\'/></svg>'"/>
         </div>`
      : `<div class="card-thumb-wrap">
           <svg width="44" height="44" viewBox="0 0 24 24" fill="none"
                stroke="#7a6030" stroke-width="1" aria-hidden="true">
             <rect x="3" y="3" width="18" height="18" rx="1"/>
             <circle cx="8.5" cy="8.5" r="1.5"/>
             <path d="M21 15l-5-5L5 21"/>
           </svg>
         </div>`;

    card.innerHTML = `
      ${thumbHtml}
      <div class="card-body">
        ${item.tag ? `<span class="card-tag">${item.tag}</span>` : ''}
        <p class="card-num">Nº ${String(idx + 1).padStart(2, '0')}</p>
        <h3 class="card-title">${item.title}</h3>
        <p class="card-desc">${item.short}</p>
        <span class="card-cta" aria-hidden="true">Ver detalhes →</span>
      </div>`;

    grid.appendChild(card);
    cardObserver.observe(card);
  });
}

// ═══════════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════════
let _visibleList = [];   // lista visível na última abertura de modal

function openModal(item, visibleList, idx) {
  _visibleList       = visibleList || getVisible();
  currentModalIndex  = idx !== undefined ? idx : _visibleList.findIndex(i => i.id === item.id);

  _renderModal(item);
  _updateModalNav();

  const overlay = document.getElementById('modalOverlay');
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';

  // Focus trap: foca no botão fechar
  requestAnimationFrame(() => document.getElementById('modalClose').focus());
}

function _renderModal(item) {
  const wrap = document.getElementById('modalImgWrap');
  const mImg = document.getElementById('modalImg');

  if (item.imgPath) {
    wrap.style.display = '';
    mImg.src = item.imgPath;
    mImg.alt = item.title;
    document.getElementById('modal').style.gridTemplateColumns = '';
  } else {
    wrap.style.display = 'none';
    document.getElementById('modal').style.gridTemplateColumns = '1fr';
  }

  document.getElementById('modalEyebrow').textContent = item.author || '';
  document.getElementById('modalTitle').textContent   = item.title;
  document.getElementById('modalBody').innerHTML =
    (item.full || '').split('\n').map(p => p.trim() ? `<p>${p}</p>` : '').join('');

  const mc = document.getElementById('modalConcepts');
  if (item.concepts && item.concepts.length) {
    mc.style.display = 'block';
    mc.innerHTML = `<p class="mc-title">◆ Conceitos Fundamentais</p>
      <ul class="clist">${item.concepts.map(c => `<li>${c}</li>`).join('')}</ul>`;
  } else {
    mc.style.display = 'none';
  }

  const me = document.getElementById('modalExamples');
  if (item.examples && item.examples.length) {
    me.style.display = 'block';
    me.innerHTML = `<p class="me-title">▸ Exemplos no Cotidiano</p>
      <ul class="elist">${item.examples.map(e => `<li>${e}</li>`).join('')}</ul>`;
  } else {
    me.style.display = 'none';
  }

  // Reseta scroll do modal
  const modal = document.getElementById('modal');
  modal.scrollTop = 0;
  modal.querySelector('.modal-content').scrollTop = 0;
}

function _updateModalNav() {
  document.getElementById('modalPrev').disabled = currentModalIndex <= 0;
  document.getElementById('modalNext').disabled = currentModalIndex >= _visibleList.length - 1;
}

document.getElementById('modalPrev').addEventListener('click', () => {
  if (currentModalIndex > 0) {
    currentModalIndex--;
    _renderModal(_visibleList[currentModalIndex]);
    _updateModalNav();
  }
});

document.getElementById('modalNext').addEventListener('click', () => {
  if (currentModalIndex < _visibleList.length - 1) {
    currentModalIndex++;
    _renderModal(_visibleList[currentModalIndex]);
    _updateModalNav();
  }
});

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

function overlayClick(e) {
  if (e.target.id === 'modalOverlay') closeModal();
}

// ═══════════════════════════════════════════════════════
// FOCUS TRAP no modal
// ═══════════════════════════════════════════════════════
document.getElementById('modalOverlay').addEventListener('keydown', e => {
  if (!document.getElementById('modalOverlay').classList.contains('active')) return;

  if (e.key === 'Escape') { closeModal(); return; }
  if (e.key === 'ArrowLeft')  { document.getElementById('modalPrev').click(); return; }
  if (e.key === 'ArrowRight') { document.getElementById('modalNext').click(); return; }

  if (e.key !== 'Tab') return;

  const focusable = [...document.getElementById('modal').querySelectorAll(
    'button:not(:disabled), [href], input, [tabindex]:not([tabindex="-1"])'
  )];
  if (!focusable.length) return;

  const first = focusable[0];
  const last  = focusable[focusable.length - 1];

  if (e.shiftKey) {
    if (document.activeElement === first) { e.preventDefault(); last.focus(); }
  } else {
    if (document.activeElement === last)  { e.preventDefault(); first.focus(); }
  }
});

// ═══════════════════════════════════════════════════════
// KEYBOARD GLOBAL
// ═══════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('modalOverlay').classList.contains('active')) {
    closeModal();
  }
});

// ═══════════════════════════════════════════════════════
// BACK TO TOP
// ═══════════════════════════════════════════════════════
const backToTop = document.getElementById('backToTop');

window.addEventListener('scroll', () => {
  backToTop.classList.toggle('visible', window.scrollY > 400);
}, { passive: true });

backToTop.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
buildTags();
renderGallery();
</script>
</body>
</html>
